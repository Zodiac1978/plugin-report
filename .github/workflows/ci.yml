name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: ramsey/composer-install@v2 # or alternative dependency management
    - uses: dingo-d/phpstan-wp-action@v2

  spelling:
    name: Typos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master

  coding-standards:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: WPCS check
      uses: 10up/wpcs-action@stable
      with:
        standard: WordPress
        paths: .

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          coverage: none
          tools: wp-cli

      - name: Build production plugin
        run: |
          wp package install wp-cli/dist-archive-command:@stable
          wp dist-archive . /tmp/plugin-report.zip
          mkdir -p build
          unzip /tmp/plugin-report.zip -d build
  
      - name: Setup WP Env
        run: npm install -g @wordpress/env
  
      - name: Start WP Env
        run: wp-env start
  
      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1.1.6
        with:
          build-dir: "./build/plugin-report"
          exclude-checks: |
            plugin_updater
            trademarks
          wp-version: "latest"
